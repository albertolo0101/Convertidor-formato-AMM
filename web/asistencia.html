<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gravitas · Asistencia</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

:root {
  --bg:#080b12; --surface:#0e1320; --surface2:#141a28;
  --border:#1a2235; --border2:#243048;
  --accent:#00e5ff; --accent-dim:rgba(0,229,255,.1);
  --green:#00ff88; --green-dim:rgba(0,255,136,.08);
  --yellow:#ffd166; --yellow-dim:rgba(255,209,102,.08);
  --red:#ff4466; --red-dim:rgba(255,68,102,.08);
  --text:#ccd6f6; --dim:#4a5878; --bright:#e8f0ff;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(0,229,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.022) 1px,transparent 1px);
  background-size:48px 48px;pointer-events:none;z-index:0;}

.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:40px 24px 80px;}

.hdr{margin-bottom:36px;display:flex;align-items:center;gap:16px;}
.hdr-logo{height:56px;width:auto;display:block;}
.hdr h1{font-family:var(--mono);font-size:clamp(20px,4vw,30px);font-weight:700;color:var(--bright);letter-spacing:-.02em;}
.hdr p{font-size:11px;color:var(--dim);margin-top:4px;font-family:var(--mono);}
.back-link{font-family:var(--mono);font-size:11px;color:var(--dim);text-decoration:none;border:1px solid var(--border2);padding:6px 12px;margin-left:auto;}
.back-link:hover{color:var(--accent);border-color:var(--accent);}

.section-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--dim);margin-bottom:14px;margin-top:32px;}

.empleados-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;}
.emp-btn{background:var(--surface);border:1px solid var(--border);padding:28px 20px;
  text-align:left;cursor:pointer;position:relative;overflow:hidden;transition:border-color .15s;
  font-family:var(--sans);color:var(--text);}
.emp-btn::after{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--border2);}
.emp-btn.adentro::after{background:var(--green);}
.emp-btn.afuera::after{background:var(--dim);}
.emp-btn:hover{border-color:var(--border2);}
.emp-btn:disabled{opacity:.5;cursor:not-allowed;}
.emp-nombre{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--bright);margin-bottom:8px;}
.emp-estado{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;}
.emp-estado.adentro{color:var(--green);}
.emp-estado.afuera{color:var(--dim);}

.log-list{background:var(--surface);border:1px solid var(--border);font-family:var(--mono);font-size:12px;}
.log-row{display:flex;gap:14px;padding:9px 16px;border-bottom:1px solid rgba(26,34,53,.5);}
.log-row:last-child{border-bottom:none;}
.log-hora{color:var(--accent);width:70px;flex-shrink:0;}
.log-nombre{flex:1;color:var(--text);}
.log-accion{text-transform:uppercase;letter-spacing:.06em;}
.log-accion.entrada{color:var(--green);}
.log-accion.salida{color:var(--yellow);}
.log-empty{padding:16px;color:var(--dim);font-family:var(--mono);font-size:12px;}

/* OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(3,5,10,.92);z-index:10;
  display:none;align-items:center;justify-content:center;padding:20px;}
.overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border2);padding:32px;
  max-width:420px;width:100%;text-align:center;}
.modal-nombre{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--bright);margin-bottom:18px;}
.modal video, .modal .foto-preview{width:100%;max-width:320px;border:1px solid var(--border2);
  margin:0 auto 18px;display:block;background:#000;}
.modal .foto-preview{transform:scaleX(-1);}
.modal-msg{font-family:var(--mono);font-size:12px;color:var(--dim);margin-bottom:18px;line-height:1.6;}
.modal-msg.warn{color:var(--yellow);}
.accion-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.accion-btn{padding:16px;font-family:var(--mono);font-size:14px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--border2);
  background:transparent;color:var(--text);cursor:pointer;transition:all .15s;}
.accion-btn:hover{border-color:var(--accent);}
.accion-btn.sugerida{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);}
.accion-btn:disabled{opacity:.5;cursor:not-allowed;}
.modal-cancel{font-family:var(--mono);font-size:11px;color:var(--dim);background:transparent;
  border:none;cursor:pointer;text-decoration:underline;}
.confirm-check{font-size:40px;margin-bottom:10px;}
.confirm-txt{font-family:var(--mono);font-size:15px;color:var(--bright);line-height:1.7;}
.confirm-txt .a{color:var(--green);}
.confirm-txt .s{color:var(--yellow);}

.footer{margin-top:56px;border-top:1px solid var(--border);padding-top:16px;
  font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.04em;}
</style>
</head>
<body>
<div class="wrap">

<div class="hdr">
  <img class="hdr-logo" src="../logo.png" alt="Gravitas Logo"/>
  <div>
    <h1>Asistencia</h1>
    <p>// Planta Solar 5 MW · Guatemala</p>
  </div>
  <a class="back-link" href="launcher.html">← Panel principal</a>
</div>

<div class="section-lbl">Marcar asistencia</div>
<div class="empleados-grid" id="empleadosGrid"></div>

<div class="section-lbl">Registros de hoy</div>
<div class="log-list" id="logHoy"><div class="log-empty">Cargando…</div></div>

<div class="footer">GRAVITAS · SUITE · LA FOTO ES SOLO PARA VERIFICAR QUIÉN MARCÓ · SE BORRA A LOS 14 DÍAS</div>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-nombre" id="modalNombre"></div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
let empleadosCache = [];
let fotoDataUrl = null;
let streamActivo = null;

window.addEventListener('load', () => {
  cargarEstado();
  cargarLogHoy();
});

async function cargarEstado() {
  try {
    const resp = await fetch('/api/estado');
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || 'error');
    empleadosCache = data.empleados;
    renderEmpleados();
  } catch (e) {
    document.getElementById('empleadosGrid').innerHTML =
      `<div class="log-empty">Error cargando empleados: ${escHtml(e.message)}</div>`;
  }
}

function renderEmpleados() {
  const grid = document.getElementById('empleadosGrid');
  grid.innerHTML = empleadosCache.map(emp => `
    <button class="emp-btn ${emp.estado === 'Adentro' ? 'adentro' : 'afuera'}" onclick="abrirModal('${emp.id}')">
      <div class="emp-nombre">${escHtml(emp.nombre)}</div>
      <div class="emp-estado ${emp.estado === 'Adentro' ? 'adentro' : 'afuera'}">${emp.estado}</div>
    </button>
  `).join('');
}

async function cargarLogHoy() {
  try {
    const resp = await fetch('/api/asistencia/hoy');
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || 'error');
    const filas = data.registros.slice().reverse();
    const el = document.getElementById('logHoy');
    if (!filas.length) {
      el.innerHTML = '<div class="log-empty">Sin registros hoy todavía.</div>';
      return;
    }
    el.innerHTML = filas.map(f => `
      <div class="log-row">
        <span class="log-hora">${escHtml(f.hora)}</span>
        <span class="log-nombre">${escHtml(f.empleado_nombre)}</span>
        <span class="log-accion ${f.accion}">${f.accion}</span>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('logHoy').innerHTML =
      `<div class="log-empty">Error cargando log: ${escHtml(e.message)}</div>`;
  }
}

async function abrirModal(empleadoId) {
  const emp = empleadosCache.find(e => e.id === empleadoId);
  if (!emp) return;
  fotoDataUrl = null;
  document.getElementById('modalNombre').textContent = emp.nombre;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('modalBody').innerHTML = `
    <video id="camPreview" autoplay playsinline muted></video>
    <div class="modal-msg">Verificando… no te muevas.</div>
  `;

  try {
    streamActivo = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
    const video = document.getElementById('camPreview');
    video.srcObject = streamActivo;
    await new Promise(res => { video.onloadedmetadata = res; });
    await new Promise(res => setTimeout(res, 700)); // dejar que la cámara ajuste exposición
    fotoDataUrl = capturarFrame(video);
    detenerCamara();
    mostrarSeleccionAccion(emp, fotoDataUrl);
  } catch (e) {
    detenerCamara();
    mostrarSeleccionAccion(emp, null);
  }
}

function capturarFrame(video) {
  const canvas = document.createElement('canvas');
  canvas.width = 640;
  canvas.height = 480;
  canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
  return canvas.toDataURL('image/jpeg', 0.7);
}

function detenerCamara() {
  if (streamActivo) {
    streamActivo.getTracks().forEach(t => t.stop());
    streamActivo = null;
  }
}

function mostrarSeleccionAccion(emp, foto) {
  const sugerida = emp.estado === 'Adentro' ? 'salida' : 'entrada';
  const fotoHtml = foto
    ? `<img class="foto-preview" src="${foto}" alt="Foto capturada"/>`
    : `<div class="modal-msg warn">📷 Sin cámara disponible — se marcará sin foto.</div>`;
  document.getElementById('modalBody').innerHTML = `
    ${fotoHtml}
    <div class="accion-btns">
      <button class="accion-btn ${sugerida === 'entrada' ? 'sugerida' : ''}" onclick="confirmarAccion('${emp.id}','entrada')">Entrada</button>
      <button class="accion-btn ${sugerida === 'salida' ? 'sugerida' : ''}" onclick="confirmarAccion('${emp.id}','salida')">Salida</button>
    </div>
    <button class="modal-cancel" onclick="cerrarModal()">Cancelar</button>
  `;
}

async function confirmarAccion(empleadoId, accion) {
  const emp = empleadosCache.find(e => e.id === empleadoId);
  document.querySelectorAll('.accion-btn').forEach(b => b.disabled = true);

  try {
    const resp = await fetch('/api/asistencia', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        empleado_id: empleadoId,
        accion,
        ...(fotoDataUrl ? { foto_base64: fotoDataUrl } : {}),
      }),
    });
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || 'error al registrar');

    const ahora = new Date().toLocaleTimeString('es-GT', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('modalBody').innerHTML = `
      <div class="confirm-check">✅</div>
      <div class="confirm-txt">${escHtml(emp.nombre)}<br><span class="${accion === 'entrada' ? 'a' : 's'}">${accion.toUpperCase()}</span> · ${ahora}</div>
    `;
    await cargarEstado();
    await cargarLogHoy();
    setTimeout(cerrarModal, 1800);
  } catch (e) {
    document.getElementById('modalBody').innerHTML = `<div class="modal-msg warn">Error: ${escHtml(e.message)}</div>
      <button class="modal-cancel" onclick="cerrarModal()">Cerrar</button>`;
  }
}

function cerrarModal() {
  detenerCamara();
  fotoDataUrl = null;
  document.getElementById('overlay').classList.remove('open');
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
